# GitLab CI for mem0-viewer.
#
# This exists because GitHub Actions is disabled on the account that hosts the
# canonical repository, so the homelab GitLab at 192.168.8.111 runs the checks
# instead. GitHub remains the canonical public home; this mirror is where the
# pipeline actually executes. The two are kept in sync by pushing to both.
#
#   check   typecheck, unit tests, production build. The build is an artifact
#           rather than a side effect, so a green pipeline is a statement about
#           a bundle that can be downloaded and inspected.
#
# There is nothing to deploy: the app is a static bundle with no backend, and
# publishing it is a decision for whoever hosts it. So this pipeline verifies
# and stops. That is deliberate — a "deploy" job here would have nowhere
# meaningful to go.
#
# ── What has to exist before this runs ─────────────────────────────────────
#
# A Docker-executor runner registered **for this project** (id 5). The homelab
# GitLab has project-scoped runners only, which is the house pattern: a project
# runner needs no tags, because nothing else can pick it up. Its config lives in
# the `redteam-lab/gitlab-runner` dataset on the GitLab host. If it ever needs
# re-registering, the recipe is in the product repo's deploy/deb/README.md.
#
# ── Why the jobs look the way they do ──────────────────────────────────────

stages:
  - check

variables:
  # Keep logs in UTC so timestamps line up with everything else that describes
  # this repo.
  TZ: UTC

check:
  stage: check
  # Matches the runner's default image, and Node 22 is the version the README
  # tells contributors to use.
  image: node:22-bookworm
  # Safe to kill: nothing here has side effects outside the job container, so a
  # superseded pipeline can be cancelled instead of finishing work nobody wants.
  interruptible: true
  before_script:
    # The checkout is owned by a uid that is not the job's, which git refuses to
    # work with until told the directory is expected. Without this the job fails
    # at the first git operation, which is a confusing way to report it.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # `packageManager` in package.json pins the exact pnpm, so this activates
    # the pinned one. Asking for `pnpm@latest` would let a pnpm major land on a
    # day nobody was looking.
    - corepack enable
    - corepack prepare --activate
  script:
    # --frozen-lockfile: CI installs what the lockfile says, or fails. A silent
    # resolution drift would mean the checks ran against dependencies nobody
    # reviewed.
    - pnpm install --frozen-lockfile
    # Typecheck first: it is the fastest gate and the one most likely to catch a
    # bad edit, so there is no point building a bundle that cannot compile.
    - pnpm typecheck
    - pnpm test
    # The build is last and its output is what the artifact holds. `pnpm build`
    # runs tsc itself as well, which is belt-and-braces against a future script
    # change dropping it.
    - pnpm build
    - echo "==> built $(ls dist/assets/index-*.js | head -1) from $(git rev-parse --short HEAD)"
  artifacts:
    name: "mem0-viewer-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days
  rules:
    # Branches, tags and merge requests all get checked; there is no
    # environment to protect, so nothing needs to be restricted to `main`.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
